# ============================================================
# HTTPS Configuration for Mobile QR Scanner
# - Camera and GPS require a secure context (HTTPS)
# - Self-signed certificate generated for LAN IP 172.20.10.2
# ============================================================
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:itum-keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=itum2024
server.ssl.key-alias=itum-attendance

# Keep HTTP port alive on 8080 so http://... redirects to https://...
# (handled by HttpRedirectConfig bean)
server.http.port=8080

# Spring Application Name
spring.application.name=university-qr-attendance

# Database Configuration (Embedded High-Performance Database with MySQL Compatibility Mode)
spring.datasource.url=jdbc:h2:file:./data/attendance;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=true

# H2 Web Console (accessible at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Logging Configuration
logging.level.com.university.attendance=INFO
logging.level.org.springframework.web=INFO

# File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Never expose internal stack traces on error pages
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false
