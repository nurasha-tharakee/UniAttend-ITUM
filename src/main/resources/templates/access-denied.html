<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied | UniAttend</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
    <div class="text-center p-4" style="max-width: 500px;">
        <div class="display-1 text-danger mb-3">
            <i class="bi bi-shield-x"></i>
        </div>
        <h2 class="fw-bold mb-2">Access Denied (403)</h2>
        <p class="text-muted mb-4">
            You do not have permission to view or access this resource. Please make sure you are logged into the correct role.
        </p>
        <a th:href="@{/}" class="btn btn-primary px-4 py-2 rounded-pill">
            <i class="bi bi-house-door me-2"></i> Return to Dashboard
        </a>
    </div>
</body>
</html>
