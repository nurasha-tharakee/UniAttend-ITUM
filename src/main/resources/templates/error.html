<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error | UniAttend - ITUM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 p-3">
<div class="card shadow-sm border-0 text-center p-4 p-md-5" style="max-width: 520px; border-radius: 18px;">
    <div class="mb-3">
        <i class="bi bi-shield-exclamation text-warning" style="font-size: 3.5rem;"></i>
    </div>
    <h3 class="fw-bold text-dark mb-2" th:text="${status != null} ? 'Error ' + ${status} : 'Something Went Wrong'">Error</h3>
    <p class="text-muted small mb-4">
        <span th:if="${status == 404}">The requested page or resource could not be found in UniAttend.</span>
        <span th:if="${status == 403}">You do not have permission to access this resource.</span>
        <span th:if="${status == 500}">An unexpected server error occurred. Please try again or contact the administrator.</span>
        <span th:if="${status != 404 and status != 403 and status != 500}">Your request could not be completed. Please return to the portal.</span>
    </p>
    <div class="d-flex justify-content-center gap-2">
        <a th:href="@{/}" class="btn btn-primary rounded-pill px-4">
            <i class="bi bi-house-door me-1"></i> Return Home
        </a>
        <a th:href="@{/login}" class="btn btn-outline-secondary rounded-pill px-4">Sign In</a>
    </div>
</div>
</body>
</html>
