<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Admin - Lecture Sessions')}"></head>
<body>

<div class="app-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('sessions')}"></div>

    <div class="main-content">
        <div th:replace="~{fragments/layout :: navbar}"></div>

        <main class="page-container">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
                <div>
                    <h3 class="fw-bold text-dark mb-1">
                        <i class="bi bi-broadcast text-primary me-2"></i>Institutional Lecture Sessions
                    </h3>
                    <p class="text-muted small mb-0">Overview of all active and past lecture attendance sessions</p>
                </div>
                <div>
                    <span class="badge bg-secondary px-3 py-2" th:text="${sessions.size()} + ' Total Sessions'">0 Sessions</span>
                </div>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="bg-light">
                                <tr>
                                    <th>#</th>
                                    <th>Subject</th>
                                    <th>Session Name</th>
                                    <th>Lecturer</th>
                                    <th>Date & Start Time</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="s, iter : ${sessions}">
                                    <td class="text-muted small" th:text="${iter.count}">1</td>
                                    <td>
                                        <span class="badge bg-primary-subtle text-primary border border-primary-subtle fw-semibold"
                                              th:text="${s.subject != null ? s.subject.code : ''}">CS101</span>
                                        <div class="small text-muted" th:text="${s.subject != null ? s.subject.name : ''}">Subject</div>
                                    </td>
                                    <td class="fw-semibold text-dark" th:text="${s.sessionName}">Session Topic</td>
                                    <td class="small text-muted" th:text="${s.lecturer != null ? s.lecturer.fullName : 'Unassigned'}">Dr. Smith</td>
                                    <td class="small">
                                        <span th:text="${s.sessionDate}">2024-05-10</span> &bull; <strong th:text="${s.startTime}">10:00</strong>
                                    </td>
                                    <td>
                                        <span class="badge" th:classappend="${s.active == true} ? 'bg-success' : 'bg-secondary'"
                                              th:text="${s.active == true} ? 'Active' : 'Ended'">Active</span>
                                    </td>
                                    <td>
                                        <form th:if="${s.active == true}" th:action="@{/admin/sessions/{id}/end(id=${s.id})}" method="post"
                                              onsubmit="return confirm('End this lecture session immediately?');">
                                            <button type="submit" class="btn btn-sm btn-outline-danger rounded-pill px-3">
                                                <i class="bi bi-stop-circle me-1"></i> End Session
                                            </button>
                                        </form>
                                        <span th:if="${s.active == false}" class="text-muted small">Concluded</span>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(sessions)}">
                                    <td colspan="7" class="text-center py-5 text-muted">No lecture sessions recorded.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
