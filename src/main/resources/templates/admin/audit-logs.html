<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Admin - System Audit Logs')}"></head>
<body>

<div class="app-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('audit')}"></div>

    <div class="main-content">
        <div th:replace="~{fragments/layout :: navbar}"></div>

        <main class="page-container">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
                <div>
                    <h3 class="fw-bold text-dark mb-1">
                        <i class="bi bi-shield-lock-fill text-primary me-2"></i>Security & System Audit Logs
                    </h3>
                    <p class="text-muted small mb-0">Immutable records of institutional attendance events, overrides, and user actions</p>
                </div>
                <div>
                    <span class="badge bg-secondary px-3 py-2" th:text="${logs.size()} + ' Recent Events'">0 Events</span>
                </div>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <div class="table-responsive" style="max-height: 600px; overflow-y: auto;">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="sticky-top bg-light">
                                <tr>
                                    <th>#</th>
                                    <th>Timestamp</th>
                                    <th>User</th>
                                    <th>Action</th>
                                    <th>Event Details</th>
                                    <th>IP Address</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="log, iter : ${logs}">
                                    <td class="text-muted small" th:text="${iter.count}">1</td>
                                    <td class="small fw-semibold text-dark"
                                        th:text="${#temporals.format(log.createdAt, 'dd MMM yyyy, hh:mm:ss a')}">10 May 2024, 10:00:00 AM</td>
                                    <td>
                                        <span class="badge bg-light text-dark border fw-bold" th:text="${log.username}">admin</span>
                                    </td>
                                    <td>
                                        <span class="badge bg-primary-subtle text-primary border border-primary-subtle"
                                              th:text="${log.action}">LOGIN</span>
                                    </td>
                                    <td class="small text-muted" th:text="${log.details}">Action details</td>
                                    <td>
                                        <code class="small text-secondary" th:text="${log.ipAddress != null ? log.ipAddress : '127.0.0.1'}">127.0.0.1</code>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(logs)}">
                                    <td colspan="6" class="text-center py-5 text-muted">
                                        No audit log entries recorded yet.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
